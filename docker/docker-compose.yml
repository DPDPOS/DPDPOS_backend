services:
  postgres:
    image: postgres:16-alpine
    container_name: dpdpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpdpos
      POSTGRES_PASSWORD: dpdpos
      POSTGRES_DB: dpdpos
    ports:
      - "5432:5432"
    volumes:
      - dpdpos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpdpos -d dpdpos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dpdpos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dpdpos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: dpdpos-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # MailHog inbox UI

  minio:
    image: minio/minio:latest
    container_name: dpdpos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dpdpos_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: dpdpos-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/dpdpos-evidence || true;
      exit 0;
      "

volumes:
  dpdpos_pg_data:
  dpdpos_redis_data:
  dpdpos_minio_data:
